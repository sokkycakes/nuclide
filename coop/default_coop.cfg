// Co-op defaults, run after Rad-Therapy's default_valve.cfg
set hostname "Co-op Server"
set g_gametype "coop"
// Bulwark Live matchmaking: co-op players only meet co-op players, in the
// campaign, firefight and horde playlists (live_queue firefight)
set live_game "coop"
set sv_playerslots "32"
set maxplayers "32"
set coop "1"
set deathmatch "0"
set sv_friendlyFire "0"
// players can't hurt allied NPCs (Barney, scientists, HECU allies), as in Sven
set sv_allyDamage "0"
set mp_allowvote "1"
set timelimit "0"
set fraglimit "0"
// 1 easy, 2 medium, 3 hard. A "callvote skill N" vote changes it for monsters spawned after it
set skill "2"

// see src/rules/coop.qc for what these do
set coop_respawnDelay "5"
set coop_survival "0"
set coop_reviveTime "2.5"
set coop_waveDelay "10"
set coop_maxMonsters "40"

// no scoreboard while down or waiting to respawn (Tab still shows it)
seta cg_scoresWhenDead "0"

// Counter-Strike Online's teammate outline: other players (bots included) get
// a green outline that shows through walls. Bulwark only; 0 turns it off
seta cg_teamOutline "1"
