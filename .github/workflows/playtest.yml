# Publishes Stiletto Proto to playtesters.
# Every push to the `playtest` branch (or `playtest/<name>`) becomes a live
# update: the launcher on each tester's PC sees the new build the next time it
# starts. Files go to a GitHub release (tag `playtest`, or `playtest-<name>`);
# only files that changed are uploaded and downloaded.
name: Playtest build

on:
  push:
    branches:
      - playtest
      - 'playtest/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04   # older glibc, so the Linux launcher runs on more distros
    env:
      # Bulwark branch the Linux build runs Stiletto on
      BULWARK_REF: claude/project-thread-ir3p0a
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          # Bulwark needs GCC 13 (C++20 <format>); 22.04 gets it from the toolchain PPA
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-13 cmake
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 libsdl2-dev libcurl4-openssl-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev || sudo apt-get install -y -qq gcc-mingw-w64-x86-64 libsdl2-dev libcurl4-openssl-dev libudev-dev

      - name: Cache SDL2 builds
        uses: actions/cache@v4
        with:
          path: Tools/playtest-launcher/.deps
          key: playtest-launcher-deps-${{ hashFiles('Tools/playtest-launcher/build.sh') }}

      - name: Build the launcher
        env:
          LAUNCHER_VERSION: ${{ github.sha }}
        run: |
          Tools/playtest-launcher/build.sh windows
          Tools/playtest-launcher/build.sh linux

      - name: Get Bulwark
        uses: actions/checkout@v4
        with:
          repository: sokkycakes/bulwark-engine
          ref: ${{ env.BULWARK_REF }}
          path: .bulwark-src

      - name: Build Bulwark (the Linux build runs Stiletto on it)
        env:
          CC: gcc-13
          CXX: g++-13
        run: Tools/playtest-launcher/tools/build_bulwark.sh .bulwark-src bulwark

      - name: Build every QuakeC progs from source
        # The game modules (progs.dat, csprogs.dat, hud.dat, menu.dat) and
        # the rules progs g_gametype <mode> loads (base/progs/<mode>.dat)
        # and the per-map progs a map loads (base/maps/<map>.dat)
        # are committed binaries, and a branch that changes the .qc but not
        # the binary ships the old code with no merge conflict to warn
        # anyone (a duel.qc or vgui_motd.qc change, say). duel.dat was also
        # never committed for months, so Duel silently fell back to default
        # rules. Compile every module here, every time, so what ships is
        # always built from the sources being shipped.
        run: |
          chmod +x Tools/fteqw-linux-extract/fteqcc64
          qcc="$PWD/Tools/fteqw-linux-extract/fteqcc64"
          for mod in server client hud menu; do
            echo "building base/src/$mod"
            (cd "base/src/$mod" && "$qcc" -I../../../src/common/ progs.src) || { echo "::error::base/src/$mod did not compile"; exit 1; }
          done
          # rules progs (base/progs/<mode>.dat) and per-map progs
          # (base/maps/<map>.dat: Domination's capture points on the lqdm maps)
          for dir in base/src/rules base/src/maps; do
            (
              cd "$dir"
              for src in *.src; do
                dat=$(sed -n 's/^#pragma[[:space:]]\+PROGS_DAT[[:space:]]\+"\(.*\)"/\1/p' "$src" | head -1)
                [ -n "$dat" ] || continue
                echo "building $dir/$src -> $dat"
                rm -f "$dat"
                "$qcc" -I../../../src/common/ "$src"
                [ -f "$dat" ] || { echo "::error::$dir/$src did not produce $dat"; exit 1; }
              done
            ) || exit 1
          done

      - name: Work out the channel and release notes
        id: ch
        run: |
          branch="${GITHUB_REF_NAME}"
          case "$branch" in
            playtest) tag=playtest ;;
            playtest/*) tag="playtest-$(echo "${branch#playtest/}" | tr -c 'A-Za-z0-9._-' '-')" ;;
            *) tag="playtest-$(echo "$branch" | tr -c 'A-Za-z0-9._-' '-')" ;;
          esac
          tag="${tag%-}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/manifest.json"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # notes: commits since the build players have now
          prev=$(curl -fsL "$url" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            git log --no-merges --format='- %s' "$prev..HEAD" | head -40 > notes.txt
          else
            git log --no-merges --format='- %s' -10 > notes.txt
          fi
          [ -s notes.txt ] || echo "- Rebuilt with no new commits" > notes.txt
          cat notes.txt

      - name: Make the tester download
        run: |
          mkdir -p "dist/Stiletto Proto"
          cp Tools/playtest-launcher/out/windows/playtest-launcher.exe "dist/Stiletto Proto/Stiletto Proto.exe"
          sed "s|{MANIFEST_URL}|${{ steps.ch.outputs.url }}|" Tools/playtest-launcher/games/stiletto/launcher.json > "dist/Stiletto Proto/launcher.json"
          cp Tools/playtest-launcher/docs/PLAYTESTERS.txt "dist/Stiletto Proto/README.txt"
          (cd dist && zip -qr ../StilettoProto-Windows.zip "Stiletto Proto")
          mkdir -p "dist-linux/Stiletto Proto"
          cp Tools/playtest-launcher/out/linux/playtest-launcher "dist-linux/Stiletto Proto/stiletto-proto"
          cp "dist/Stiletto Proto/launcher.json" "dist-linux/Stiletto Proto/"
          (cd dist-linux && tar czf ../StilettoProto-Linux.tar.gz "Stiletto Proto")

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 Tools/playtest-launcher/tools/publish.py --backend github \
            --repo "$GITHUB_REPOSITORY" --tag "${{ steps.ch.outputs.tag }}" \
            --src . --rules Tools/playtest-launcher/games/stiletto/publish.json \
            --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --notes-file notes.txt \
            --launcher-windows Tools/playtest-launcher/out/windows/playtest-launcher.exe \
            --launcher-linux Tools/playtest-launcher/out/linux/playtest-launcher \
            --asset StilettoProto-Windows.zip=StilettoProto-Windows.zip \
            --asset StilettoProto-Linux.tar.gz=StilettoProto-Linux.tar.gz
          echo "Testers download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ch.outputs.tag }}/StilettoProto-Windows.zip" >> "$GITHUB_STEP_SUMMARY"
