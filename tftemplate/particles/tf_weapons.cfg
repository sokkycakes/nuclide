// Team Fortress template: weapon effects. Referenced as "tf_weapons.<name>".

// flamethrower flame puff, left behind by each flame projectile
r_part flame
{
	texture "textures/particles/flames"
	tcoords 0 0 0.125 1 1 8 0.125
	count 1
	scale 28
	scalefactor 1
	scaledelta 60
	die 0.35
	alpha 0.7
	rgb 255 140 40
	blend add
	spawnmode ball
	spawnorg 4
	step 24
	gravity -120
}

