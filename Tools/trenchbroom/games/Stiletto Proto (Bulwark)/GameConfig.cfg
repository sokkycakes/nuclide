{
    "version": 9,
    "name": "Stiletto Proto (Bulwark)",
    "icon": "Icon.png",
    "fileformats": [
        {
            "format": "Quake3 (legacy)",
            "initialmap": "StarterMap.map"
        }
    ],
    "filesystem": {
        "searchpath": "base",
        "packageformat": {
            "extensions": [
                ".pk3",
                ".pk4",
                ".zip"
            ],
            "format": "zip"
        }
    },
    "materials": {
        "root": "textures",
        "extensions": [
            ".png",
            ".jpg",
            ".jpeg",
            ".tga"
        ],
        "palette": "gfx/palette.lmp",
        "excludes": [
            "*_norm",
            "*_normal",
            "*_bump",
            "*_gloss",
            "*_spec",
            "*_luma",
            "*_glow",
            "*_n",
            "*_s",
            "*_h",
            "*_d"
        ]
    },
    "entities": {
        "definitions": [
            "Stiletto.fgd"
        ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "scale": [ modelscale, modelscale_vec, scale ],
        "setDefaultProperties": false
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [
                    "transparent"
                ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "common/trigger"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/*clip*"
            },
            {
                "name": "Caulk",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/caulk*"
            },
            {
                "name": "Skip",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/skip"
            },
            {
                "name": "Nodraw",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/nodraw"
            },
            {
                "name": "Hint",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/hint"
            },
            {
                "name": "Origin",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/origin"
            },
            {
                "name": "Trigger texture",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/trigger"
            },
            {
                "name": "Areaportal",
                "attribs": [
                    "transparent"
                ],
                "match": "material",
                "pattern": "common/areaportal"
            },
            {
                "name": "Sky",
                "match": "material",
                "pattern": "*sky*"
            },
            {
                "name": "Water",
                "match": "material",
                "pattern": "*water*"
            },
            {
                "name": "Detail",
                "match": "contentflag",
                "flags": [
                    "detail"
                ]
            }
        ]
    },
    "faceattribs": {
        "defaults": {
            "scale": [
                0.25,
                0.25
            ]
        },
