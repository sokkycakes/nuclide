                    "sky"
                ]
            },
            {
                "name": "Nonsolid",
                "attribs": [
                    "transparent"
                ],
                "match": "surfaceparm",
                "pattern": [
                    "nonsolid"
                ]
            },
            {
                "name": "Clusterportal",
                "attribs": [
                    "transparent"
                ],
                "match": "surfaceparm",
                "pattern": [
                    "clusterportal"
