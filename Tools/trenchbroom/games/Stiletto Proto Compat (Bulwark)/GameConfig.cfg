{
    "version": 9,
    "name": "Stiletto Proto Compat (Bulwark)",
    "icon": "Icon.png",
    "fileformats": [
        {
            "format": "Quake3 (legacy)"
        },
        {
            "format": "Quake3 (Valve)"
        },
        {
            "format": "Valve"
        }
    ],
    "filesystem": {
        "searchpath": "base",
        "packageformat": {
            "extensions": [
                ".pk3",
                ".pk4",
                ".zip"
            ],
            "format": "zip"
        }
    },
    "materials": {
        "root": "textures",
        "extensions": [
            ".tga",
            ".png",
            ".jpg",
            ".jpeg",
            ".dds",
            ".ktx",
            ".bmp",
            ".pcx",
            ".C",
            ".D"
        ],
        "palette": "gfx/palette.lmp",
        "attribute": "wad",
        "shaderSearchPath": "scripts",
        "excludes": [
            "*_norm",
            "*_normal",
            "*_bump",
            "*_gloss",
            "*_spec",
            "*_luma",
            "*_glow",
            "*_n",
            "*_s",
            "*_h"
        ]
    },
    "entities": {
        "definitions": [
            "Stiletto-Compat.fgd"
        ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "scale": [ modelscale, modelscale_vec, scale ],
        "setDefaultProperties": false
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [
                    "transparent"
                ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "common/trigger"
            },
            {
                "name": "Detail entity",
                "match": "classname",
                "pattern": "func_detail*"
            },
            {
                "name": "Areaportal entity",
                "attribs": [
                    "transparent"
                ],
                "match": "classname",
                "pattern": "func_areaportal*"
            }
        ],
        "brushface": [
