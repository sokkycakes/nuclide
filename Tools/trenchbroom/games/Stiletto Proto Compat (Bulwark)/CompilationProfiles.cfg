{
    "version": 1,
    "profiles": [
        {
            "name": "Q3 BSP (q3map2): full",
            "workdir": "${MAP_DIR_PATH}",
            "tasks": [
                {
                    "type": "export",
                    "enabled": true,
                    "stripTbProperties": false,
                    "target": "${MAP_BASE_NAME}-compile.map"
                },
                {
                    "type": "tool",
                    "enabled": true,
                    "tool": "${q3map2}",
                    "parameters": "-v -game quake3 -fs_basepath \"${GAME_DIR_PATH}\" -fs_game ${MODS[-1]} -meta -patchmeta \"${MAP_BASE_NAME}-compile.map\"",
                    "treatNonZeroResultCodeAsError": true
                },
                {
                    "type": "tool",
                    "enabled": true,
                    "tool": "${q3map2}",
                    "parameters": "-game quake3 -fs_basepath \"${GAME_DIR_PATH}\" -fs_game ${MODS[-1]} -vis -saveprt \"${MAP_BASE_NAME}-compile.map\"",
                    "treatNonZeroResultCodeAsError": true
                },
                {
                    "type": "tool",
                    "enabled": true,
                    "tool": "${q3map2}",
                    "parameters": "-game quake3 -fs_basepath \"${GAME_DIR_PATH}\" -fs_game ${MODS[-1]} -light -fast -patchshadows -samples 2 -bounce 2 \"${MAP_BASE_NAME}-compile.map\"",
                    "treatNonZeroResultCodeAsError": true
                },
                {
                    "type": "rename",
                    "enabled": true,
                    "source": "${MAP_BASE_NAME}-compile.bsp",
                    "target": "${GAME_DIR_PATH}/${MODS[-1]}/maps/${MAP_BASE_NAME}.bsp"
                },
                {
                    "type": "launchEngine",
                    "enabled": false,
                    "engineProfileId": "bulwark",
                    "treatLaunchFailureAsError": false
                }
            ]
        },
