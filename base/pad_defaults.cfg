// Stiletto's controller layout. default_controls.cfg runs this; Bulwark
// also applies it when a controller arrives with no buttons bound, and the
// Controller page's "Restore the default controller layout" puts it back.
// GP_* are the button names both FTE and Bulwark use (Xbox labels: A is the
// bottom face button, LT/RT the triggers, LB/RB the bumpers).
bind GP_RTRIGGER "+attack"
bind GP_LTRIGGER "+hero_tool"
bind GP_RSHOULDER "+hero_guard"
bind GP_LSHOULDER "+groove"
bind GP_A "+jump"
bind GP_B "+stiletto_dash"
bind GP_X "weapon_mode"
bind GP_Y "+use"
bind GP_LTHUMB "+sprint"
bind GP_RTHUMB "+hero_melee"
bind GP_DPAD_LEFT "hero_action 0"
bind GP_DPAD_UP "hero_action 1"
bind GP_DPAD_RIGHT "hero_action 2"
bind GP_DPAD_DOWN "impulse 201"
bind GP_START "togglemenu"
bind GP_BACK "+showscores"
