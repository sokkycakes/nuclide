<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Title Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <!--
    WebCore port of engine/ui/title_menu.slint
    Figma 16:9 reference: 1365 × 768 (node 46:2)
    Transparent root — game / void shows through.
    Assets inlined: this WebCore build paints data: / inline SVG
    reliably; external fte:// <img> loads still flake.
  -->
  <div id="stage" class="stage" data-selected="0">
    <div class="panel" aria-hidden="true">
      <div class="panel__base"></div>
      <div class="panel__red"></div>
      <div class="panel__edge panel__edge--top"></div>
      <div class="panel__edge panel__edge--bottom"></div>
    </div>

    <div id="focus-bar" class="focus-bar" aria-hidden="true">
      <div class="focus-bar__edge focus-bar__edge--top"></div>
      <div class="focus-bar__edge focus-bar__edge--bottom"></div>
    </div>

    <nav id="menu" class="menu" role="listbox" aria-label="Title menu">
      <button type="button" class="menu-item is-selected" role="option" aria-selected="true"
        data-index="0" data-cmd="menu_lobby_create" data-action="create-lobby">Create Lobby</button>
      <button type="button" class="menu-item" role="option" aria-selected="false"
        data-index="1" data-cmd="" data-action="join-lobby">Join Lobby</button>
      <button type="button" class="menu-item" role="option" aria-selected="false"
        data-index="2" data-cmd="menu_options" data-action="settings">Settings</button>
      <button type="button" class="menu-item" role="option" aria-selected="false"
        data-index="3" data-cmd="quit" data-action="quit">Quit</button>
    </nav>

    <div id="join-dialog" class="join-dialog hidden" aria-hidden="true">
      <div class="join-dialog__backdrop" data-join-close></div>
      <div class="join-dialog__panel panel-bm" role="dialog" aria-labelledby="join-title">
        <div class="panel-bm__head" id="join-title">Join Lobby</div>
        <div class="panel-bm__body">
          <div id="create-options" style="display:none">
            <p>Choose how friends will join your lobby.</p>
            <p><button type="button" class="btn-bm" id="create-online">Online — share a room code</button></p>
            <p><button type="button" class="btn-bm" id="create-lan">LAN — same local network</button></p>
          </div>
          <div class="join-lan">
            <div class="join-lan__row">
              <span class="join-lan__label">Local LAN</span>
              <button type="button" class="btn-bm" id="join-refresh">Refresh</button>
            </div>
            <ul class="join-lan__list" id="join-list">
              <li class="is-empty">Press Refresh to find LAN lobbies</li>
            </ul>
            <button type="button" class="btn-bm" id="join-connect" disabled>Join Selected</button>
          </div>
          <div class="join-addr">
            <label class="join-lan__label" for="join-addr">Address / IP</label>
            <div class="join-lan__row">
              <input type="text" id="join-addr" class="join-addr__input" value="127.0.0.1:27501" spellcheck="false" autocomplete="off" />
              <button type="button" class="btn-bm" id="join-addr-go">Join</button>
            </div>
          </div>
          <div class="join-code">
            <label class="join-lan__label" for="join-code">Room Code (online)</label>
            <div class="join-lan__row">
              <input type="text" id="join-code" class="join-addr__input" placeholder="ABCD12" spellcheck="false" autocomplete="off" maxlength="32" />
              <button type="button" class="btn-bm" id="join-code-go">Join</button>
            </div>
          </div>
          <button type="button" class="btn-bm btn-bm--ghost" data-join-close>Back</button>
        </div>
      </div>
    </div>
