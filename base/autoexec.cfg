// Preserve command-line history across normal engine restarts.
seta con_savehistory 1

// WebCore fullscreen menu + HUD (trusted local HTML under data/web/).
// Menu URL: webcore_menu_url (default fte://data/web/title-menu/index.html)
// HUD URL:  webcore_hud_url  (default fte://data/web/hud/index.html)
// slint_hud must stay 0 so CSQC runs (WebCore HUD is drawn from hud.qc).
set slint_menu 0
set slint_ui 0
set slint_hud 0
set webcore_hud 1
set webcore_hud_url "fte://data/web/hud/index.html?v=2"
// Duel/arena warmup uses the QL WebCore selector instead of VGUI team/class menus.
set cl_webcore_arena_ui 1
// Title menu: v1 = title-menu/, v2 = title-menu-v2/ (Figma flash-pixel look)
set webcore_menu_url "fte://data/web/title-menu-v2/index.html"
plug_load webcore
// Optional A/B: plug_load cef
// v1: set webcore_menu_url "fte://data/web/title-menu/index.html"
// Halo 3 menu: set webcore_menu_url "fte://data/web/h3-main-menu/index.html"

// Disable the Nuclide MenuQC (vgui) menu so it doesn't intercept input or draw
// over the WebCore menu. This does NOT delete menu.dat -- it just tells
// the engine's MP_Init to skip loading it (see pr_menu.c forceqmenu check).
// To re-enable the vgui menu later: set forceqmenu 0 (or remove these two lines).
set forceqmenu 1
menu_restart

// Title 3D backdrop map name (engine loads via webcore_menumap on title push).
seta webcore_menumap "background02"

// GoldSrc playermodels under models/player/<name>/<name>.mdl
// Each folder also needs the model textures (e.g. alice2.bmp) beside the .mdl.
seta _cl_playermodel alice2
setinfo model alice2
headmodel alice2
team_model alice2
team_headmodel alice2
setinfo topcolor 0x909090
setinfo bottomcolor 0x606060

// Other shipped models: jennifer2, natasha2, yuri2
//   setinfo model jennifer2

// Hero-action defaults (legacy +attack2 / +stiletto_grapple remain registered).
bind MOUSE2 "+hero_tool"
bind ALT "+hero_melee"
bind Q "+hero_guard"
bind SHIFT "+groove"
bind Z "hero_action 0"
bind X "hero_action 1"
bind C "hero_action 2"
bind R "weapon_mode"
