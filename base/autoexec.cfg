// WebCore fullscreen menu + HUD (trusted local HTML under data/web/).
// Menu URL: webcore_menu_url (default fte://data/web/h3-main-menu/index.html)
// HUD URL:  webcore_hud_url  (default fte://data/web/webcore-test/hud-smoke.html)
// Toggle HUD: set webcore_hud 1
set slint_menu 0
set slint_ui 0
plug_load webcore
// Optional A/B: plug_load cef

// Disable the Nuclide MenuQC (vgui) menu so it doesn't intercept input or draw
// over the WebCore menu. This does NOT delete menu.dat -- it just tells
// the engine's MP_Init to skip loading it (see pr_menu.c forceqmenu check).
// To re-enable the vgui menu later: set forceqmenu 0 (or remove these two lines).
set forceqmenu 1
menu_restart

// GoldSrc playermodels under models/player/<name>/<name>.mdl
// Each folder also needs the model textures (e.g. alice2.bmp) beside the .mdl.
seta _cl_playermodel alice2
setinfo model alice2
headmodel alice2
team_model alice2
team_headmodel alice2
setinfo topcolor 0x909090
setinfo bottomcolor 0x606060

// Other shipped models: jennifer2, natasha2, yuri2
//   setinfo model jennifer2

// Secondary fire on Q key (melee swing for Vagrant).
// Melee on Q, hero ability on right-click.
bind q "+attack2"
bind MOUSE2 "+stiletto_grapple"
