set hostname "Stiletto Swift"
set maxplayers "8"
set maxclients "8"
set sv_playerslots "8"

set con_color "0 255 0"
set vgui_color "0 255 0"
set cross_color "0 255 0"
set r_menutint "0.22 0.278 0.40"

set con_textfont "fonts/IBMPlexMono-Text.otf?col=1,1,1"
set con_textsize "12"
set cg_projectileLightFlare "1"
set cg_modelSpinSpeed "210"

set menu_color_button_bg "0.82 0.88 0.94"
set menu_color_button_select "1 0.25 0.25"
set menu_color_button_click "1 0.5 0.5"
set menu_color_help "0.75 0.75 0.75"
set menu_color_list "0.75 0.8 1.0"
set menu_color_list_select "0.3 0.2 0.5"
set menu_color_input_text "0.75 0.8 1.0"
set menu_color_scrollbar_select "0.75 0.8 1.0"
set menu_color_scrollbar_click "0.4 0.25 0.6"
set menu_color_prompt_text "0.75 0.8 1.0"

set g_spawnflagFilter "1"

// Player setup defaults. config.cfg runs after this file, so a player's own
// choices (the engine's Player setup page, or the console) win.
// Model: empty wears each hero's own; or one of the GoldSrc stand-ins under
// models/player/<name>/<name>.mdl (alice2, jennifer2, natasha2, yuri2), which
// heroes that still use a stand-in then wear. Heroes with their own model keep it.
// (Not _cl_playermodel: older builds archived that as alice2 in every config.)
seta cg_heroModel ""
seta headmodel "alice2"
seta team_model "alice2"
seta team_headmodel "alice2"
// Colours in FTE's 24-bit form, 0xRRGGBB: the upper one tints the hero, the
// lower one what they carry (cg_playerColorTint sets how strongly, 0 is off).
// Team modes show team colours and give these back afterwards.
seta topcolor "0x909090"
seta bottomcolor "0x606060"
seta cg_playerColorTint "0.5"
// Spray (impulse 201): an image under logos/, sent as the "spray" user info blob.
seta _cl_playerspray "logos/fte.png"
