// Stiletto Proto - dedicated server settings.
// (No semicolons in comments here: they would split the line.)
//
// A dedicated server runs this file once at start-up, after the game's own
// configs (quake.rc and the default_*.cfg files) and before the command
// line. Listen servers (Play / Create Lobby / "map" from the console) do not
// read it, so nothing here changes normal play.
//
// Start a server (from the game folder, next to base.fmf):
//   Linux (Bulwark):   bulwark/bulwark-ded -basedir . -game base
//                  or: bulwark/bulwark -dedicated -basedir . -game base
//   Windows (FTE):     fteqw64.exe -dedicated -basedir . -manifest base.fmf
// Anything on the command line wins over this file, e.g.
//   bulwark/bulwark-ded -basedir . -game base -port 27500 +set g_gametype freezetag +map duel_alley
// Type commands into the server window while it runs: status, serverinfo,
// map <name>, kick <name or slot>, addBot <profile>, say <text>, quit.
// Players join with "connect <server address>:27500" from the console, or
// from Find Servers on the same network.

// --- name and slots ---------------------------------------------------------
set hostname "Stiletto Proto server"	// shown in the server browser
set maxplayers 8			// player slots (Duel queues the extras as spectators)
set maxclients 8			// the same, under FTE's name
set maxspectators 8			// QuakeWorld spectators (setinfo spectator 1)

// --- game mode ----------------------------------------------------------------
// duel, freezetag, archstiletto, deathmatch, teamdm, lastmanstanding,
// domination. Takes effect on the next map.
set g_gametype duel
set timelimit 15			// minutes per map, 0 for none
set fraglimit 0				// score that ends a deathmatch map, 0 for none
//set duel_roundLimit 3			// Duel: rounds to win a match
//set freezetag_teamSize 2		// Freeze Tag: players per team
//set freezetag_roundLimit 5		// Freeze Tag: rounds to win
//set bot_minClients -1			// keep this many slots filled with bots, -1 for off

// --- access -------------------------------------------------------------------
set sv_public 0				// 1 lists the server on the master server (none is running yet)
set password ""				// players set "setinfo password <this>" to join, empty for none
set spectator_password ""		// spectators set "setinfo spectator <this>", empty for none
set rcon_password ""			// remote console password, empty turns rcon off

// --- first map ------------------------------------------------------------------
// The map to start when the command line starts none. This is not a plain
// "map" line: that would run before the command line, so a "+map" (or a
// "+exec" of a cfg with a map in it) would load a second map after it.
// A dedicated server runs the startmap_dm alias once the command line has
// run, and only when no map is running yet (stock FTE does this itself,
// host-server.sh asks Bulwark for it). Change the map name here.
alias startmap_dm "map duel_alley"

